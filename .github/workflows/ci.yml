name: CI

# Build + test on every push and PR (SQLite plus real PostgreSQL, MySQL and SQL Server via Testcontainers).
# Pushes to main publish prerelease packages to GitHub Packages; v* tags publish releases to nuget.org
# (trusted publishing, no stored API key), GitHub Packages and a GitHub Release.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # ez-odata-api comes from its published packages on nuget.org (Directory.Build.props: EzOdataVersion)

jobs:
  test:
    name: Build & test (4 databases, SimpleCRUD ${{ matrix.simplecrud }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The minimum the packages depend on, and SimpleCRUD's newest release.
        simplecrud: ['2.3.0', '2.4.0-beta1']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build EzOdata.SimpleCrud.slnx -c Release -p:SimpleCrudVersion=${{ matrix.simplecrud }}

      - name: Test
        run: >
          dotnet test EzOdata.SimpleCrud.slnx -c Release --no-build -p:SimpleCrudVersion=${{ matrix.simplecrud }}
          --logger "console;verbosity=normal" --logger trx --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-simplecrud-${{ matrix.simplecrud }}
          path: TestResults/*.trx

  publish:
    name: Publish packages
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write # nuget.org trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Version
        run: |
          base=$(dotnet msbuild src/EzOdata.SimpleCrud -getProperty:EzScVersion)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="${base}-ci.${GITHUB_RUN_NUMBER}"; fi
          echo "PACKAGE_VERSION=$v" >> "$GITHUB_ENV"
          echo "Publishing $v (project version $base)"

      - name: Pack
        run: |
          for p in src/EzOdata.SimpleCrud src/EzOdata.SimpleCrud.AspNetCore; do
            dotnet pack "$p" -c Release -o artifacts -p:EzScVersion=$PACKAGE_VERSION
          done

      - name: Smoke test the packed packages
        # Installs the exact .nupkg files (tests/Smoke/nuget.config → ./artifacts) and runs both packages.
        run: dotnet run --project tests/Smoke -p:SmokeVersion=$PACKAGE_VERSION

      - name: Push to GitHub Packages
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
          --api-key "${{ secrets.GITHUB_TOKEN }}" --skip-duplicate --no-symbols

      - name: Log in to nuget.org (trusted publishing)
        if: startsWith(github.ref, 'refs/tags/v')
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: rvegajr

      - name: Push to nuget.org
        if: startsWith(github.ref, 'refs/tags/v')
        # .snupkg symbol packages next to each .nupkg are pushed to nuget.org's symbol server too.
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --source https://api.nuget.org/v3/index.json
          --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --skip-duplicate

      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ env.PACKAGE_VERSION }}
          path: artifacts/*.*nupkg

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""; [[ "$PACKAGE_VERSION" == *-* ]] && prerelease="--prerelease"
          gh release create "$GITHUB_REF_NAME" artifacts/*.nupkg artifacts/*.snupkg --title "$GITHUB_REF_NAME" --generate-notes $prerelease
